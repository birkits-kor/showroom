<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#cbc3b6">
  <title>버킷츠 모션베드 쇼룸 예약</title>
  <link rel="icon" href="./birkit-logo.jpg" type="image/jpeg">
  <style>
    :root { --ink: #161616; --muted: #6c6964; --line: #ddd8d0; --paper: #ffffff; --warm: #cbc3b6; --soft: #f5f3ef; --accent: #b74337; }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body { font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--soft); margin: 0; padding: 24px; color: var(--ink); font-size: 17px; line-height: 1.55; -webkit-font-smoothing: antialiased; }
    .container { max-width: 900px; margin: 20px auto 48px; background: var(--paper); padding: clamp(26px, 5vw, 58px); border: 1px solid #e5e0d8; border-radius: 28px; box-shadow: 0 24px 70px rgba(42, 37, 31, 0.08); overflow: hidden; position: relative; }
    .container::before { content: ''; position: absolute; width: 280px; height: 280px; right: -170px; top: -150px; border: 36px solid rgba(203, 195, 182, 0.23); border-radius: 50%; pointer-events: none; }
    .brand-header { display: flex; align-items: center; gap: 22px; margin-bottom: 30px; position: relative; }
    .brand-logo { width: 94px; height: 94px; object-fit: cover; border-radius: 18px; border: 1px solid #d7d0c5; flex: 0 0 auto; }
    .eyebrow { margin: 0 0 5px; color: var(--muted); font-size: 13px; font-weight: 800; letter-spacing: 0.16em; text-transform: uppercase; }
    h1 { margin: 0; font-size: clamp(28px, 5vw, 40px); line-height: 1.16; letter-spacing: -0.04em; }
    .subtitle { color: var(--muted); font-size: 17px; margin: 8px 0 0; }
    .form-group { margin-bottom: 28px; }
    label.section-title { display: block; margin-bottom: 11px; font-weight: 800; font-size: 18px; color: var(--ink); letter-spacing: -0.02em; }
    .title-hint { display: block; font-size: 14px; font-weight: 500; color: var(--muted); margin-top: 3px; }
    input[type="text"], input[type="tel"], input[type="date"], select, textarea { width: 100%; min-height: 56px; padding: 14px 16px; border: 1.5px solid var(--line); border-radius: 12px; font: inherit; font-size: 18px; color: var(--ink); background: #fff; transition: border-color .2s, box-shadow .2s; }
    input::placeholder, textarea::placeholder { color: #9a9690; }
    input:focus, select:focus, textarea:focus { border-color: var(--ink); outline: none; box-shadow: 0 0 0 4px rgba(22,22,22,.08); }
    input[readonly] { background: #f1efeb; color: #5e5a55; }
    select:disabled { background: #f2f0ec; color: #777; cursor: not-allowed; }
    textarea { resize: vertical; min-height: 116px; }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .row .form-group { min-width: 0; }
    .showroom-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px; }
    .showroom-card { position: relative; cursor: pointer; display: flex; min-width: 0; -webkit-tap-highlight-color: transparent; }
    .showroom-card input[type="radio"] { position: absolute; width: 1px; height: 1px; opacity: 0; }
    .card-content { border: 2px solid var(--line); border-radius: 18px; overflow: hidden; transition: border-color .2s, box-shadow .2s, transform .2s; background: #fff; min-height: 100%; width: 100%; display: flex; flex-direction: column; }
    .card-content img { width: 100%; aspect-ratio: 16/9; object-fit: cover; display: block; background: #eeeae4; }
    .card-info { padding: 18px; text-align: left; flex-grow: 1; display: flex; flex-direction: column; background: #fff; border-top: 1px solid #eeeae4; }
    .card-title { font-weight: 900; font-size: 20px; color: var(--ink); line-height: 1.3; letter-spacing: -0.025em; }
    .sub-text { font-size: 15px; font-weight: 500; color: var(--muted); display: block; margin-top: 3px; }
    .display-info { font-size: 14px; color: #645f58; font-weight: 700; background: #f1efeb; padding: 6px 10px; border-radius: 999px; display: inline-flex; align-self: flex-start; margin: 12px 0 15px; }
    .select-button, .btn-map { min-height: 50px; display: flex; align-items: center; justify-content: center; border-radius: 10px; width: 100%; font-size: 16px; font-weight: 800; text-align: center; }
    .select-button { background: var(--ink); color: #fff; margin-top: auto; }
    .selected-label { display: none; }
    .btn-map { text-decoration: none; background: #f2f0ec; color: var(--ink); border: 1px solid #ded9d1; margin-top: 9px; transition: background .2s; }
    .btn-map:hover { background: #e9e5df; }
    .showroom-card:hover .card-content { border-color: #a29b90; transform: translateY(-2px); }
    .showroom-card input[type="radio"]:focus-visible + .card-content { outline: 4px solid rgba(22,22,22,.18); outline-offset: 3px; }
    .showroom-card input[type="radio"]:checked + .card-content { border-color: var(--ink); box-shadow: 0 0 0 3px rgba(22,22,22,.09); }
    .showroom-card input[type="radio"]:checked + .card-content .select-button { background: var(--warm); color: var(--ink); }
    .showroom-card input[type="radio"]:checked + .card-content .default-label { display: none; }
    .showroom-card input[type="radio"]:checked + .card-content .selected-label { display: inline; }
    .notice-text { font-size: 16px; color: #4f4b46; margin-top: 8px; line-height: 1.6; background: #f3f1ed; padding: 16px 18px; border-radius: 12px; }
    .important-notice { background: var(--ink); color: #fff; border-radius: 16px; padding: 19px 21px; margin-bottom: 34px; line-height: 1.55; position: relative; }
    .important-notice strong { display: block; font-size: 18px; margin-bottom: 3px; }
    .important-notice p { margin: 0; color: #dedad3; font-size: 16px; }
    .important-notice a { display: inline-flex; min-height: 44px; align-items: center; margin-top: 8px; color: #fff; font-size: 15px; font-weight: 800; text-underline-offset: 4px; }
    [hidden] { display: none !important; }
    .manage-panel { margin-top: 40px; padding: clamp(22px, 4vw, 32px); border: 1px solid var(--line); border-radius: 18px; background: #f7f5f1; scroll-margin-top: 20px; }
    .manage-panel h3 { margin: 0 0 7px; font-size: 24px; letter-spacing: -0.03em; }
    .manage-panel p { margin: 0 0 22px; color: var(--muted); font-size: 16px; line-height: 1.6; }
    .btn-contact { width: 100%; min-height: 56px; margin-top: 4px; background: #fff; color: var(--ink); border: 1.5px solid var(--ink); font-size: 17px; font-weight: 900; padding: 14px; border-radius: 12px; cursor: pointer; transition: background .2s, color .2s; }
    .btn-contact:hover { background: var(--ink); color: #fff; }
    .btn-contact:disabled { border-color: #ccc; color: #999; background: #eeeae4; cursor: not-allowed; }
    .lookup-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .lookup-grid .form-group { margin-bottom: 12px; }
    .manage-status { margin-top: 16px; padding: 14px 16px; border-radius: 10px; background: #ece9e3; color: #4f4b46; font-size: 16px; line-height: 1.5; }
    .manage-status.error { background: #fff0ee; color: #a5352b; }
    .reservation-list { display: grid; gap: 14px; margin-top: 16px; }
    .reservation-item { padding: 18px; border: 1px solid var(--line); border-radius: 14px; background: #fff; }
    .reservation-title { font-weight: 900; color: var(--ink); margin-bottom: 6px; font-size: 19px; }
    .reservation-detail { color: #57534e; font-size: 16px; line-height: 1.6; white-space: pre-line; }
    .reservation-actions { display: flex; flex-wrap: wrap; gap: 9px; margin-top: 16px; }
    .btn-small { flex: 1; min-width: 108px; min-height: 50px; border: 1px solid var(--ink); border-radius: 10px; padding: 12px 14px; background: #fff; color: var(--ink); font-weight: 800; font-size: 15px; text-align: center; text-decoration: none; cursor: pointer; box-sizing: border-box; }
    .btn-small:hover { background: #f1efeb; }
    .btn-small.primary { background: var(--ink); color: #fff; }
    .btn-small.danger { border-color: var(--accent); color: var(--accent); }
    .edit-banner { margin-bottom: 24px; padding: 17px 18px; border: 1px solid #978f84; border-radius: 12px; background: #f1efeb; color: #383531; font-size: 16px; line-height: 1.5; }
    .edit-banner strong { display: block; margin-bottom: 4px; }
    .btn-cancel-edit { min-height: 44px; margin-top: 6px; border: 0; background: transparent; color: #383531; font-size: 15px; font-weight: 800; text-decoration: underline; text-underline-offset: 3px; cursor: pointer; padding: 0; }
    .btn-submit { width: 100%; min-height: 62px; background: var(--ink); color: #fff; font-size: 19px; font-weight: 900; padding: 17px; border: none; border-radius: 13px; cursor: pointer; margin-top: 14px; transition: transform .2s, background .2s; }
    .btn-submit:hover { background: #303030; transform: translateY(-1px); }
    .btn-submit:disabled { background: #888; cursor: not-allowed; transform: none; }
    @media (max-width: 720px) {
      body { padding: 0; background: #fff; }
      .container { margin: 0; padding: 24px 18px 44px; border: 0; border-radius: 0; box-shadow: none; }
      .brand-header { align-items: flex-start; gap: 14px; margin-bottom: 24px; }
      .brand-logo { width: 76px; height: 76px; border-radius: 14px; }
      .eyebrow { font-size: 11px; }
      h1 { font-size: 29px; }
      .subtitle { font-size: 16px; }
      .showroom-grid, .lookup-grid, .row { grid-template-columns: 1fr; }
      .row { gap: 0; }
      .showroom-grid { gap: 16px; }
      .card-title { font-size: 21px; }
      .important-notice { margin-bottom: 30px; }
      .manage-panel { margin-inline: -4px; }
    }
  </style>
</head>
<body>

<div class="container">
  <header class="brand-header">
    <img class="brand-logo" src="./birkit-logo.jpg" alt="버킷츠 로고" width="300" height="300">
    <div>
      <p class="eyebrow">AI MOTION BED SHOWROOM</p>
      <h1>쇼룸 방문 예약</h1>
      <p class="subtitle">편안한 체험을 위해 방문하실 매장과 시간을 선택해 주세요.</p>
    </div>
  </header>

  <div class="important-notice" role="note" aria-label="예약 방문 안내">
    <strong>예약 시간을 꼭 지켜주세요.</strong>
    <p>방문이 늦을 경우에는 예약한 매장에 미리 연락해 주세요.</p>
    <a href="#manageReservation">기존 예약 조회·변경·취소</a>
  </div>
  
  <form id="reservationForm">
    <div class="edit-banner" id="editBanner" hidden>
      <strong>기존 예약을 변경하는 중입니다.</strong>
      <span id="editBannerText"></span>
      <button type="button" class="btn-cancel-edit" id="cancelEditBtn">변경 중단하고 새 예약으로 돌아가기</button>
    </div>

    <div class="row">
      <div class="form-group">
        <label class="section-title" for="name">예약자 성함</label>
        <input type="text" id="name" placeholder="성함을 입력해 주세요" autocomplete="name" required>
      </div>
      <div class="form-group">
        <label class="section-title" for="phone">휴대전화 번호</label>
        <input type="tel" id="phone" placeholder="010-0000-0000" autocomplete="tel" inputmode="tel" required>
      </div>
    </div>

    <div class="form-group">
      <label class="section-title">방문 쇼룸을 선택해 주세요 <span class="title-hint">카드의 어느 부분을 눌러도 선택됩니다. 매장 정보는 네이버 지도에서 확인해 주세요.</span></label>
      <div class="showroom-grid">
        
        <label class="showroom-card">
          <input type="radio" name="showroom" value="삼성점(봉은사역)" required>
          <div class="card-content">
            <img loading="lazy" decoding="async" src="https://search.pstatic.net/common/?src=https%3A%2F%2Fldb-phinf.pstatic.net%2F20220719_38%2F1658226936756vzA7S_JPEG%2FKakaoTalk_20220719_193158907_12.jpg" alt="삼성점">
            <div class="card-info">
              <div class="card-title">삼성점<span class="sub-text">(봉은사역)</span></div>
              <div class="display-info">전사이즈 전제품</div>
              <span class="select-button"><span class="default-label">이 매장 선택</span><span class="selected-label">선택 완료 ✓</span></span>
              <a href="https://naver.me/FbVBWSQz" target="_blank" class="btn-map" onclick="event.stopPropagation();">네이버 지도 ↗</a>
            </div>
          </div>
        </label>

        <label class="showroom-card">
          <input type="radio" name="showroom" value="압구정점">
          <div class="card-content">
            <img loading="lazy" decoding="async" src="https://search.pstatic.net/common/?src=https%3A%2F%2Fldb-phinf.pstatic.net%2F20180304_295%2F1520132091061njO7N_JPEG%2F9a6BXKmSNkwo6VWXOKQVefDZ.jpg" alt="압구정점">
            <div class="card-info">
              <div class="card-title">압구정점<span class="sub-text">(현대아파트 맞은편)</span></div>
              <div class="display-info">슈브 SS</div>
              <span class="select-button"><span class="default-label">이 매장 선택</span><span class="selected-label">선택 완료 ✓</span></span>
              <a href="https://naver.me/5PVXL3GU" target="_blank" class="btn-map" onclick="event.stopPropagation();">네이버 지도 ↗</a>
            </div>
          </div>
        </label>

        <label class="showroom-card">
          <input type="radio" name="showroom" value="아주대 병원점(수원시 영통구)">
          <div class="card-content">
            <img loading="lazy" decoding="async" src="https://search.pstatic.net/common/?src=https%3A%2F%2Fldb-phinf.pstatic.net%2F20220714_220%2F1657786161373VAwEu_JPEG%2F%25B1%25D7%25B8%25B23.jpg" alt="아주대 병원점">
            <div class="card-info">
              <div class="card-title">아주대 병원점<span class="sub-text">(수원 영통구)</span></div>
              <div class="display-info">슈브 SS</div>
              <span class="select-button"><span class="default-label">이 매장 선택</span><span class="selected-label">선택 완료 ✓</span></span>
              <a href="https://naver.me/FY3Odocw" target="_blank" class="btn-map" onclick="event.stopPropagation();">네이버 지도 ↗</a>
            </div>
          </div>
        </label>

        <label class="showroom-card">
          <input type="radio" name="showroom" value="회기점(동대문구)">
          <div class="card-content">
            <img loading="lazy" decoding="async" src="https://search.pstatic.net/common/?src=https%3A%2F%2Fldb-phinf.pstatic.net%2F20241130_277%2F17329384926682j14d_JPEG%2FKakaoTalk_20241130_124737637.jpg" alt="회기점">
            <div class="card-info">
              <div class="card-title">회기점<span class="sub-text">(동대문구)</span></div>
              <div class="display-info">마베드SS / 슈브S+S</div>
              <span class="select-button"><span class="default-label">이 매장 선택</span><span class="selected-label">선택 완료 ✓</span></span>
              <a href="https://naver.me/FK0NVfhW" target="_blank" class="btn-map" onclick="event.stopPropagation();">네이버 지도 ↗</a>
            </div>
          </div>
        </label>

        <label class="showroom-card">
          <input type="radio" name="showroom" value="이브자리 양재(하나로마트 정문 우측)">
          <div class="card-content">
            <img loading="lazy" decoding="async" src="https://i.namu.wiki/i/k02q7GA1rNjI-eZOU8SSjGW8k4wRnV1B5EB-x68-P81W0jjLqFL3qPpcwpZrvr2PyuF8jdcxsSTKh3qbvpGfzQ.webp" alt="양재점">
            <div class="card-info">
              <div class="card-title">이브자리 양재<span class="sub-text">(하나로마트 정문 우측)</span></div>
              <div class="display-info">슈브 SS</div>
              <span class="select-button"><span class="default-label">이 매장 선택</span><span class="selected-label">선택 완료 ✓</span></span>
              <a href="https://naver.me/FRoQ1AYk" target="_blank" class="btn-map" onclick="event.stopPropagation();">네이버 지도 ↗</a>
            </div>
          </div>
        </label>

        <label class="showroom-card">
          <input type="radio" name="showroom" value="파주운정점(스타필드 빌리지)">
          <div class="card-content">
            <img loading="lazy" decoding="async" src="https://search.pstatic.net/common/?src=https%3A%2F%2Fldb-phinf.pstatic.net%2F20260505_298%2F1777947714273oHIu5_JPEG%2FKakaoTalk_20260505_112107650.jpg" alt="파주운정점">
            <div class="card-info">
              <div class="card-title">파주운정점<span class="sub-text">(스타필드 빌리지)</span></div>
              <div class="display-info">마베드SS / 슈브 SS</div>
              <span class="select-button"><span class="default-label">이 매장 선택</span><span class="selected-label">선택 완료 ✓</span></span>
              <a href="https://naver.me/Ffsewkgu" target="_blank" class="btn-map" onclick="event.stopPropagation();">네이버 지도 ↗</a>
            </div>
          </div>
        </label>

      </div>
    </div>

    <div class="row">
      <div class="form-group">
        <label class="section-title" for="date">방문 날짜</label>
        <input type="date" id="date" required>
      </div>
      <div class="form-group">
        <label class="section-title" for="time">방문 시간 <span class="title-hint">(1시간 단위)</span></label>
        <select id="time" required disabled>
          <option value="" disabled selected>지점과 날짜를 먼저 선택해주세요</option>
        </select>
      </div>
    </div>

    <div class="form-group">
      <label class="section-title" for="memo">추가 문의사항 (선택)</label>
      <textarea id="memo" placeholder="원하시는 침대 사이즈나 특별한 요청사항이 있다면 적어주세요."></textarea>
    </div>

    <div class="notice-text">
      신청과 동시에 예약이 접수되며 별도의 확정 연락은 드리지 않습니다.
    </div>

    <button type="submit" class="btn-submit" id="submitBtn">예약 신청하기</button>
  </form>

  <section class="manage-panel" id="manageReservation" aria-labelledby="manageTitle">
    <h3 id="manageTitle">내 예약 조회·변경·취소</h3>
    <p>예약할 때 입력한 성함과 연락처로 예정된 예약을 조회할 수 있습니다.</p>
    <form id="lookupForm">
      <div class="lookup-grid">
        <div class="form-group">
          <label class="section-title" for="manageName">예약자 성함</label>
          <input type="text" id="manageName" autocomplete="name" required>
        </div>
        <div class="form-group">
          <label class="section-title" for="managePhone">예약자 연락처</label>
          <input type="tel" id="managePhone" placeholder="010-0000-0000" autocomplete="tel" required>
        </div>
      </div>
      <button type="submit" class="btn-contact" id="lookupBtn">내 예약 조회하기</button>
    </form>
    <div class="manage-status" id="manageStatus" aria-live="polite" hidden></div>
    <div class="reservation-list" id="reservationList"></div>
  </section>
</div>

<script type="text/plain" id="legacyReservationScript">
  // 🚨 아래 주소는 대표님의 구글 앱스 스크립트 웹앱 URL로 꼭 변경해주세요!
  const GOOGLE_APP_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbw6BNSJXaL1FKdodWEsE4vMREDONPqaDqp3AB-lOfNISAygDf4MAqVLUzLN9VExVU4M/exec";

  // 과거 날짜 예약 방지
  const dateInput = document.getElementById('date');
  const today = new Date().toISOString().split("T")[0];
  dateInput.min = today;

  const timeSelect = document.getElementById('time');
  const showroomRadios = document.querySelectorAll('input[name="showroom"]');

  // 💡 법정 공휴일 판별 함수 (주말은 지점마다 규칙이 달라 아래 개별로직에서 처리합니다)
  const isHoliday = (dateObj) => {
    const mm = String(dateObj.getMonth() + 1).padStart(2, '0');
    const dd = String(dateObj.getDate()).padStart(2, '0');
    const mmdd = `${mm}-${dd}`;
    
    // 신정, 삼일절, 어린이날, 현충일, 광복절, 개천절, 한글날, 성탄절
    const publicHolidays = ["01-01", "03-01", "05-05", "06-06", "08-15", "10-03", "10-09", "12-25"];
    return publicHolidays.includes(mmdd);
  };

  // 💡 매장별 영업시간 및 휴무일 동적 처리 (오픈 시간 & 마감 시간 계산)
  const generateTimeOptions = (bookedTimes = []) => {
    timeSelect.innerHTML = '<option value="" disabled selected>원하시는 시간을 선택해주세요</option>';
    
    const selectedShowroom = document.querySelector('input[name="showroom"]:checked')?.value;
    const selectedDateStr = dateInput.value;
    if (!selectedShowroom || !selectedDateStr) return;

    const dateObj = new Date(selectedDateStr);
    const day = dateObj.getDay(); // 0:일, 1:월, 2:화, 3:수, 4:목, 5:금, 6:토
    const isHoli = isHoliday(dateObj);

    let openHour = 10; // 기본 오픈시간
    let closeHour = 20; // 기본 종료시간

    // 매장별 개별 조건 세팅
    switch(selectedShowroom) {
      case "삼성점(봉은사역)":
        openHour = 10;
        // 월(1)~목(4) 평일은 21시, 그 외(금토일 및 공휴일)는 20.5 (20시30분)
        closeHour = (day >= 1 && day <= 4 && !isHoli) ? 21 : 20.5;
        break;

      case "압구정점":
        openHour = 10;
        if (day === 0) closeHour = 20.5; // 일요일 20:30
        else if (day === 5 || isHoli) closeHour = 20; // 금요일 및 공휴일 20:00
        else closeHour = 21; // 월~목, 토요일 21:00
        break;

      case "아주대 병원점(수원시 영통구)":
        // 토(6), 일(0) 및 공휴일 전체 휴무 (-1로 설정)
        if (day === 0 || day === 6 || isHoli) {
          closeHour = -1;
        } else {
          openHour = 10;
          closeHour = 18; // 평일 18:00
        }
        break;

      case "회기점(동대문구)":
        openHour = 10;
        closeHour = (day === 0) ? 19 : 21; // 일요일만 19시 마감, 나머지 21시
        break;

      case "이브자리 양재(하나로마트 정문 우측)":
        openHour = 9; // 09:00 오픈
        closeHour = 20; // 매일 20:00 마감
        break;

      case "파주운정점(스타필드 빌리지)":
        openHour = 10;
        closeHour = 22; // 매일 22:00 마감
        break;
    }

    // 휴무일 차단 처리
    if (closeHour === -1) {
      timeSelect.innerHTML = '<option value="" disabled selected>해당 날짜는 매장 휴무일입니다.</option>';
      timeSelect.disabled = true;
      return;
    }

    // 시간을 분 단위로 환산하여 1시간 단위 옵션 생성
    const startMins = openHour * 60;
    // 1시간 체험이 영업 종료 전에 끝나도록 마지막 신청 가능 시간을 계산합니다.
    const endMins = (closeHour * 60) - 60; 

    for (let mins = startMins; mins <= endMins; mins += 60) {
      let h = Math.floor(mins / 60);
      let m = mins % 60;
      let timeStr = String(h).padStart(2, '0') + ":" + String(m).padStart(2, '0');

      let option = document.createElement('option');
      option.value = timeStr;
      option.text = timeStr;

      // 기존 30분 예약이 남아 있어도 새 1시간 예약과 겹치지 않도록 함께 대조합니다.
      const halfHourLater = String(h).padStart(2, '0') + ":30";
      if (bookedTimes.includes(timeStr) || bookedTimes.includes(halfHourLater)) {
        option.disabled = true;
        option.text = `${timeStr} (예약마감)`;
      }
      timeSelect.appendChild(option);
    }
  };

  // 통신 및 이벤트 바인딩
  const fetchBookedTimes = () => {
    const selectedShowroom = document.querySelector('input[name="showroom"]:checked')?.value;
    const selectedDate = dateInput.value;

    if (!selectedShowroom || !selectedDate) {
      timeSelect.disabled = true;
      timeSelect.innerHTML = '<option value="" disabled selected>지점과 날짜를 먼저 선택해주세요</option>';
      return;
    }

    timeSelect.disabled = true;
    timeSelect.innerHTML = '<option value="" disabled selected>예약 가능 시간 확인 중...</option>';

    fetch(`${GOOGLE_APP_SCRIPT_URL}?action=getBookedTimes&date=${selectedDate}&showroom=${encodeURIComponent(selectedShowroom)}`)
      .then(response => response.json())
      .then(data => {
        generateTimeOptions(data.bookedTimes || []);
        // 휴무일 처리(-1)가 안 된 정상 영업일만 select를 열어줌
        if(timeSelect.options[0].text !== '해당 날짜는 매장 휴무일입니다.') {
          timeSelect.disabled = false;
        }
      })
      .catch(error => {
        console.error('Error:', error);
        generateTimeOptions([]); 
        if(timeSelect.options[0].text !== '해당 날짜는 매장 휴무일입니다.') {
          timeSelect.disabled = false;
        }
      });
  };

  showroomRadios.forEach(radio => radio.addEventListener('change', fetchBookedTimes));
  dateInput.addEventListener('change', fetchBookedTimes);

  // 예약 변경·취소 시 선택한 매장의 연락처 페이지를 안내합니다.
  const showroomMapUrls = {
    "삼성점(봉은사역)": "https://naver.me/FbVBWSQz",
    "압구정점": "https://naver.me/5PVXL3GU",
    "아주대 병원점(수원시 영통구)": "https://naver.me/FY3Odocw",
    "회기점(동대문구)": "https://naver.me/FK0NVfhW",
    "이브자리 양재(하나로마트 정문 우측)": "https://naver.me/FRoQ1AYk",
    "파주운정점(스타필드 빌리지)": "https://naver.me/Ffsewkgu"
  };
  const manageShowroom = document.getElementById('manageShowroom');
  const contactShowroomBtn = document.getElementById('contactShowroomBtn');

  manageShowroom.addEventListener('change', () => {
    contactShowroomBtn.disabled = !showroomMapUrls[manageShowroom.value];
  });

  contactShowroomBtn.addEventListener('click', () => {
    const mapUrl = showroomMapUrls[manageShowroom.value];
    if (mapUrl) window.open(mapUrl, '_blank', 'noopener,noreferrer');
  });

  // 예약 신청 서브밋
  document.getElementById('reservationForm').addEventListener('submit', function(e) {
    e.preventDefault();
    
    const selectedShowroom = document.querySelector('input[name="showroom"]:checked');
    if(!selectedShowroom) {
      alert("방문하실 지점을 선택해주세요.");
      return;
    }

    const submitBtn = document.getElementById('submitBtn');
    submitBtn.innerText = '예약 접수 중...';
    submitBtn.disabled = true;

    const requestData = {
      name: document.getElementById('name').value,
      phone: document.getElementById('phone').value,
      showroom: selectedShowroom.value,
      date: document.getElementById('date').value,
      time: document.getElementById('time').value,
      memo: document.getElementById('memo').value
    };

    fetch(GOOGLE_APP_SCRIPT_URL, {
      method: 'POST',
      body: JSON.stringify(requestData),
      headers: { 'Content-Type': 'text/plain' } 
    })
    .then(response => response.json())
    .then(data => {
      if(data.result === 'success') {
        alert('성공적으로 예약이 접수되었습니다!\n\n확정 연락은 따로 드리지 않으니, 신청하신 일정에 맞춰 방문해 주세요.');
        document.getElementById('reservationForm').reset();
        fetchBookedTimes(); 
      } else {
        alert('예약 접수 중 오류가 발생했습니다. 다시 시도해주세요.');
      }
    })
    .catch(error => {
      console.error('Error:', error);
      alert('네트워크 오류가 발생했습니다. 다시 시도해주세요.');
    })
    .finally(() => {
      submitBtn.innerText = '예약 신청하기';
      submitBtn.disabled = false;
    });
  });
</script>

<script>
  const GOOGLE_APP_SCRIPT_URL_V2 = "https://script.google.com/macros/s/AKfycbw6BNSJXaL1FKdodWEsE4vMREDONPqaDqp3AB-lOfNISAygDf4MAqVLUzLN9VExVU4M/exec";
  const reservationForm = document.getElementById('reservationForm');
  const nameInput = document.getElementById('name');
  const phoneInput = document.getElementById('phone');
  const dateInputV2 = document.getElementById('date');
  const timeSelectV2 = document.getElementById('time');
  const memoInput = document.getElementById('memo');
  const submitBtnV2 = document.getElementById('submitBtn');
  const showroomRadiosV2 = document.querySelectorAll('input[name="showroom"]');

  const editBannerText = document.getElementById('editBannerText');
  const cancelEditBtn = document.getElementById('cancelEditBtn');
  const lookupForm = document.getElementById('lookupForm');

  const managePhoneInput = document.getElementById('managePhone');
  const lookupBtn = document.getElementById('lookupBtn');
  const manageStatus = document.getElementById('manageStatus');
  const reservationList = document.getElementById('reservationList');

  let editingReservation = null;
  let lastLookupCredentials = null;

  const now = new Date();
  const localToday = [
    now.getFullYear(),
    String(now.getMonth() + 1).padStart(2, '0'),
    String(now.getDate()).padStart(2, '0')
  ].join('-');
  dateInputV2.min = localToday;

  const showroomMapUrlsV2 = {
    "삼성점(봉은사역)": "https://naver.me/FbVBWSQz",
    "압구정점": "https://naver.me/5PVXL3GU",
    "아주대 병원점(수원시 영통구)": "https://naver.me/FY3Odocw",
    "회기점(동대문구)": "https://naver.me/FK0NVfhW",
    "이브자리 양재(하나로마트 정문 우측)": "https://naver.me/FRoQ1AYk",
    "파주운정점(스타필드 빌리지)": "https://naver.me/Ffsewkgu"
  };

  const isHolidayV2 = (dateObject) => {
    const mm = String(dateObject.getMonth() + 1).padStart(2, '0');
    const dd = String(dateObject.getDate()).padStart(2, '0');
    return ["01-01", "03-01", "05-05", "06-06", "08-15", "10-03", "10-09", "12-25"].includes(`${mm}-${dd}`);
  };

  const generateTimeOptionsV2 = (bookedTimes = []) => {
    timeSelectV2.innerHTML = '<option value="" disabled selected>원하시는 시간을 선택해주세요</option>';

    const selectedShowroom = document.querySelector('input[name="showroom"]:checked')?.value;
    const selectedDate = dateInputV2.value;
    if (!selectedShowroom || !selectedDate) return false;

    const dateObject = new Date(`${selectedDate}T00:00:00`);
    const day = dateObject.getDay();
    const holiday = isHolidayV2(dateObject);
    let openHour = 10;
    let closeHour = 20;

    switch (selectedShowroom) {
      case "삼성점(봉은사역)":
        closeHour = (day >= 1 && day <= 4 && !holiday) ? 21 : 20.5;
        break;
      case "압구정점":
        if (day === 0) closeHour = 20.5;
        else if (day === 5 || holiday) closeHour = 20;
        else closeHour = 21;
        break;
      case "아주대 병원점(수원시 영통구)":
        if (day === 0 || day === 6 || holiday) closeHour = -1;
        else closeHour = 18;
        break;
      case "회기점(동대문구)":
        closeHour = day === 0 ? 19 : 21;
        break;
      case "이브자리 양재(하나로마트 정문 우측)":
        openHour = 9;
        closeHour = 20;
        break;
      case "파주운정점(스타필드 빌리지)":
        closeHour = 22;
        break;
    }

    if (closeHour === -1) {
      timeSelectV2.innerHTML = '<option value="" disabled selected>해당 날짜는 매장 휴무일입니다.</option>';
      timeSelectV2.disabled = true;
      return false;
    }

    const startMinutes = openHour * 60;
    const endMinutes = closeHour * 60 - 60;
    const currentMoment = new Date();
    const currentMinutes = currentMoment.getHours() * 60 + currentMoment.getMinutes();
    for (let minutes = startMinutes; minutes <= endMinutes; minutes += 60) {
      const hour = Math.floor(minutes / 60);
      const time = `${String(hour).padStart(2, '0')}:00`;
      const legacyHalfHour = `${String(hour).padStart(2, '0')}:30`;
      const option = document.createElement('option');
      option.value = time;
      option.textContent = time;
      if (selectedDate === localToday && minutes <= currentMinutes) {
        option.disabled = true;
        option.textContent = `${time} (지난 시간)`;
      } else if (bookedTimes.includes(time) || bookedTimes.includes(legacyHalfHour)) {
        option.disabled = true;
        option.textContent = `${time} (예약마감)`;
      }
      timeSelectV2.appendChild(option);
    }
    return true;
  };

  const fetchBookedTimesV2 = async () => {
    const selectedShowroom = document.querySelector('input[name="showroom"]:checked')?.value;
    const selectedDate = dateInputV2.value;
    if (!selectedShowroom || !selectedDate) {
      timeSelectV2.disabled = true;
      timeSelectV2.innerHTML = '<option value="" disabled selected>지점과 날짜를 먼저 선택해주세요</option>';
      return;
    }

    timeSelectV2.disabled = true;
    timeSelectV2.innerHTML = '<option value="" disabled selected>예약 가능 시간 확인 중...</option>';
    const excludeRow = editingReservation ? `&excludeRowId=${encodeURIComponent(editingReservation.id)}` : '';
    const url = `${GOOGLE_APP_SCRIPT_URL_V2}?action=getBookedTimes&date=${encodeURIComponent(selectedDate)}&showroom=${encodeURIComponent(selectedShowroom)}${excludeRow}`;

    try {
      const response = await fetch(url);
      const data = await response.json();
      if (data.result === 'error') throw new Error(data.message || '예약 시간 조회 실패');
      const isOpen = generateTimeOptionsV2(data.bookedTimes || []);
      timeSelectV2.disabled = !isOpen;
    } catch (error) {
      console.error(error);
      timeSelectV2.innerHTML = '<option value="" disabled selected>예약 가능 시간을 불러오지 못했습니다.</option>';
      timeSelectV2.disabled = true;
    }
  };

  const postToServer = async (payload) => {
    const response = await fetch(GOOGLE_APP_SCRIPT_URL_V2, {
      method: 'POST',
      body: JSON.stringify(payload),
      headers: { 'Content-Type': 'text/plain' }
    });
    return response.json();
  };

  const setManageStatus = (message, isError = false) => {
    manageStatus.textContent = message;
    manageStatus.classList.toggle('error', isError);
    manageStatus.hidden = !message;
  };

  const resetReservationForm = () => {
    editingReservation = null;
    reservationForm.reset();
    nameInput.readOnly = false;
    phoneInput.readOnly = false;
    editBanner.hidden = true;
    editBannerText.textContent = '';
    submitBtnV2.textContent = '예약 신청하기';
    timeSelectV2.disabled = true;
    timeSelectV2.innerHTML = '<option value="" disabled selected>지점과 날짜를 먼저 선택해주세요</option>';
  };

  const startEditingReservation = async (record) => {
    if (!lastLookupCredentials) return;
    editingReservation = record;
    nameInput.value = lastLookupCredentials.name;
    phoneInput.value = lastLookupCredentials.phone;
    nameInput.readOnly = true;
    phoneInput.readOnly = true;
    memoInput.value = record.memo || '';
    dateInputV2.value = record.date;

    showroomRadiosV2.forEach((radio) => {
      radio.checked = radio.value === record.showroom;
    });

    editBanner.hidden = false;
    editBannerText.textContent = `${record.showroom} / ${record.date} ${record.time}`;
    submitBtnV2.textContent = '예약 변경 저장하기';
    await fetchBookedTimesV2();
    timeSelectV2.value = record.time;
    reservationForm.scrollIntoView({ behavior: 'smooth', block: 'start' });
  };

  const cancelReservationV2 = async (record) => {
    if (!lastLookupCredentials) return;
    const confirmed = window.confirm(`${record.showroom}\n${record.date} ${record.time}\n\n이 예약을 취소할까요? 취소 후에는 되돌릴 수 없습니다.`);
    if (!confirmed) return;

    setManageStatus('예약을 취소하고 있습니다.');
    try {
      const data = await postToServer({
        action: 'cancelReservation',
        reservationId: record.id,
        lookupName: lastLookupCredentials.name,
        lookupPhone: lastLookupCredentials.phone
      });
      if (data.result !== 'success') throw new Error(data.message || '예약 취소에 실패했습니다.');

      if (editingReservation?.id === record.id) resetReservationForm();
      alert('예약이 취소되었습니다.');
      await lookupReservationsV2();
      await fetchBookedTimesV2();
    } catch (error) {
      setManageStatus(error.message || '예약 취소 중 오류가 발생했습니다.', true);
    }
  };

  const renderReservations = (reservations) => {
    reservationList.replaceChildren();
    reservations.forEach((record) => {
      const item = document.createElement('article');
      item.className = 'reservation-item';

      const title = document.createElement('div');
      title.className = 'reservation-title';
      title.textContent = `${record.date} ${record.time}`;

      const detail = document.createElement('div');
      detail.className = 'reservation-detail';
      detail.textContent = `방문 지점: ${record.showroom}${record.memo ? `\n문의사항: ${record.memo}` : ''}`;

      const actions = document.createElement('div');
      actions.className = 'reservation-actions';

      const editButton = document.createElement('button');
      editButton.type = 'button';
      editButton.className = 'btn-small primary';
      editButton.textContent = '예약 변경';
      editButton.addEventListener('click', () => startEditingReservation(record));

      const cancelButton = document.createElement('button');
      cancelButton.type = 'button';
      cancelButton.className = 'btn-small danger';
      cancelButton.textContent = '예약 취소';
      cancelButton.addEventListener('click', () => cancelReservationV2(record));

      actions.append(editButton, cancelButton);
      const mapUrl = showroomMapUrlsV2[record.showroom];
      if (mapUrl) {
        const contactLink = document.createElement('a');
        contactLink.className = 'btn-small';
        contactLink.href = mapUrl;
        contactLink.target = '_blank';
        contactLink.rel = 'noopener noreferrer';
        contactLink.textContent = '매장 연락';
        actions.appendChild(contactLink);
      }

      item.append(title, detail, actions);
      reservationList.appendChild(item);
    });
  };

  const lookupReservationsV2 = async () => {
    const name = manageNameInput.value.trim();
    const phone = managePhoneInput.value.trim();
    if (!name || !phone) {
      setManageStatus('예약자 성함과 연락처를 입력해 주세요.', true);
      return;
    }

    lookupBtn.disabled = true;
    lookupBtn.textContent = '예약 조회 중...';
    setManageStatus('예정된 예약을 확인하고 있습니다.');
    reservationList.replaceChildren();

    try {
      const data = await postToServer({ action: 'lookupReservation', name, phone });
      if (data.result !== 'success') throw new Error(data.message || '예약 조회에 실패했습니다.');
      lastLookupCredentials = { name, phone };
      const reservations = data.reservations || [];
      if (!reservations.length) {
        setManageStatus('일치하는 예정 예약이 없습니다. 입력 정보를 다시 확인하거나 매장에 연락해 주세요.');
        return;
      }
      setManageStatus(`예정된 예약 ${reservations.length}건을 찾았습니다.`);
      renderReservations(reservations);
    } catch (error) {
      setManageStatus(error.message || '예약 조회 중 오류가 발생했습니다.', true);
    } finally {
      lookupBtn.disabled = false;
      lookupBtn.textContent = '내 예약 조회하기';
    }
  };

  showroomRadiosV2.forEach((radio) => radio.addEventListener('change', fetchBookedTimesV2));
  dateInputV2.addEventListener('change', fetchBookedTimesV2);
  cancelEditBtn.addEventListener('click', resetReservationForm);
  lookupForm.addEventListener('submit', (event) => {
    event.preventDefault();
    lookupReservationsV2();
  });

  reservationForm.addEventListener('submit', async (event) => {
    event.preventDefault();
    const selectedShowroom = document.querySelector('input[name="showroom"]:checked');
    if (!selectedShowroom) {
      alert('방문하실 지점을 선택해 주세요.');
      return;
    }

    const wasEditing = Boolean(editingReservation);
    const requestData = {
      action: wasEditing ? 'updateReservation' : 'createReservation',
      name: nameInput.value,
      phone: phoneInput.value,
      showroom: selectedShowroom.value,
      date: dateInputV2.value,
      time: timeSelectV2.value,
      memo: memoInput.value
    };

    if (wasEditing) {
      requestData.reservationId = editingReservation.id;
      requestData.lookupName = lastLookupCredentials.name;
      requestData.lookupPhone = lastLookupCredentials.phone;
    }

    submitBtnV2.disabled = true;
    submitBtnV2.textContent = wasEditing ? '예약 변경 중...' : '예약 접수 중...';

    try {
      const data = await postToServer(requestData);
      if (data.result !== 'success') throw new Error(data.message || '요청 처리 중 오류가 발생했습니다.');

      if (wasEditing) {
        alert('예약이 변경되었습니다.');
        resetReservationForm();
        await lookupReservationsV2();
      } else {
        alert('성공적으로 예약이 접수되었습니다!\n\n확정 연락은 따로 드리지 않으니, 신청하신 일정에 맞춰 방문해 주세요.');
        resetReservationForm();
      }
      await fetchBookedTimesV2();
    } catch (error) {
      alert(error.message || '네트워크 오류가 발생했습니다. 다시 시도해 주세요.');
      await fetchBookedTimesV2();
    } finally {
      submitBtnV2.disabled = false;
      submitBtnV2.textContent = editingReservation ? '예약 변경 저장하기' : '예약 신청하기';
    }
  });
</script>

</body>
</html>
